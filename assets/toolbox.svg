<svg xmlns="http://www.w3.org/2000/svg" width="980" height="818" viewBox="0 0 980 818" font-family="'Noto Sans TC','Microsoft JhengHei','微軟正黑體','PingFang TC',sans-serif">
  <title>Luca's Skills 工具箱：元技能</title>
  <desc>不在主流程線上的元技能：動工對象是代理與文件本身，不是你的 codebase。writing-for-agents 與 wizard 為模型觸發，wait-what 與 to-questionnaire 為使用者觸發，management-frameworks、writing-hooks、diagram、svg-palette、briefing 與 caveman 仍在 draft 試用。白卡為使用者觸發，淡靛青卡為模型觸發，虛線框為 draft。</desc>

  <defs>
    <style>
      .box   { stroke-width: 2; }
      .user  { fill: #FFFFFF; stroke: #B9C6D9; }
      .model { fill: #E3EAF3; stroke: #7E93B4; }
      .draft { stroke-dasharray: 6 4; }
      .skill { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 24px; fill: #1F2933; }
      .sub   { font-size: 18px; fill: #5B6B78; }
      .note  { font-size: 18px; fill: #5B6B78; }
    </style>
  </defs>

  <rect width="980" height="818" fill="#FFFFFF"/>

  <!-- header -->
  <g id="header">
    <text x="48" y="84" font-size="40" font-weight="700" fill="#1F2933">工具箱：對代理與文件動工的元技能</text>
    <text x="48" y="118" class="note">主流程（上圖）動的是你的 codebase；這裡動的是代理、技能與文件本身。</text>
  </g>
  <g id="legend">
    <rect x="740" y="40" width="20" height="20" rx="4" class="box user"/>
    <text x="770" y="56" class="note">白卡 = 使用者觸發</text>
    <rect x="740" y="72" width="20" height="20" rx="4" class="box model"/>
    <text x="770" y="88" class="note">淡靛青 = 模型觸發</text>
    <rect x="740" y="104" width="20" height="20" rx="4" class="box user draft"/>
    <text x="770" y="120" class="note">虛線框 = draft，試用中</text>
  </g>

  <!-- cards -->
  <g id="cards">
    <rect x="48" y="150" width="436" height="104" rx="8" class="box model"/>
    <text x="266" y="186" text-anchor="middle" class="skill">/writing-for-agents</text>
    <text x="266" y="216" text-anchor="middle" class="sub">寫或改技能、AGENTS.md、CLAUDE.md 之前，</text>
    <text x="266" y="240" text-anchor="middle" class="sub">先載入這個</text>

    <rect x="508" y="150" width="436" height="104" rx="8" class="box model"/>
    <text x="726" y="186" text-anchor="middle" class="skill">/wizard</text>
    <text x="726" y="216" text-anchor="middle" class="sub">撞上只有人能做的步驟 —</text>
    <text x="726" y="240" text-anchor="middle" class="sub">開通、憑證、CI secrets、第三方後台</text>

    <rect x="48" y="278" width="436" height="104" rx="8" class="box user"/>
    <text x="266" y="314" text-anchor="middle" class="skill">/wait-what</text>
    <text x="266" y="344" text-anchor="middle" class="sub">代理講了一段沒讓你聽懂 —</text>
    <text x="266" y="368" text-anchor="middle" class="sub">停下來，要求重講一次</text>

    <rect x="508" y="278" width="436" height="104" rx="8" class="box user"/>
    <text x="726" y="314" text-anchor="middle" class="skill">/to-questionnaire</text>
    <text x="726" y="344" text-anchor="middle" class="sub">這個決策你答不了 —</text>
    <text x="726" y="368" text-anchor="middle" class="sub">做成問卷，交給掌握答案的人填</text>

    <rect x="48" y="406" width="436" height="104" rx="8" class="box model draft"/>
    <text x="266" y="442" text-anchor="middle" class="skill">/management-frameworks</text>
    <text x="266" y="472" text-anchor="middle" class="sub">管理難題不知從何拆起 —</text>
    <text x="266" y="496" text-anchor="middle" class="sub">從約 60 個框架裡挑一個給你</text>

    <rect x="508" y="406" width="436" height="104" rx="8" class="box model draft"/>
    <text x="726" y="442" text-anchor="middle" class="skill">/writing-hooks</text>
    <text x="726" y="472" text-anchor="middle" class="sub">要新增 hook、或 hook 沒擋住該擋的 —</text>
    <text x="726" y="496" text-anchor="middle" class="sub">判準、沉默紀律、防腐爛</text>

    <rect x="48" y="534" width="436" height="104" rx="8" class="box model draft"/>
    <text x="266" y="570" text-anchor="middle" class="skill">/diagram</text>
    <text x="266" y="600" text-anchor="middle" class="sub">會報、標案、工程文件需要圖 —</text>
    <text x="266" y="624" text-anchor="middle" class="sub">依受眾挑圖並繪製，缺資訊先給草稿再問</text>

    <rect x="508" y="534" width="436" height="104" rx="8" class="box model draft"/>
    <text x="726" y="570" text-anchor="middle" class="skill">/svg-palette</text>
    <text x="726" y="600" text-anchor="middle" class="sub">畫 SVG 的色盤與用色規則 —</text>
    <text x="726" y="624" text-anchor="middle" class="sub">靛青深淺＋橘強調，CI 色可覆蓋</text>

    <rect x="48" y="662" width="436" height="104" rx="8" class="box user draft"/>
    <text x="266" y="698" text-anchor="middle" class="skill">/briefing</text>
    <text x="266" y="728" text-anchor="middle" class="sub">圖畫好了要上台 —</text>
    <text x="266" y="752" text-anchor="middle" class="sub">產出口頭講稿＋導讀＋預期質詢，寫成 briefing.md</text>

    <rect x="508" y="662" width="436" height="104" rx="8" class="box user draft"/>
    <text x="726" y="698" text-anchor="middle" class="skill">/caveman</text>
    <text x="726" y="728" text-anchor="middle" class="sub">聊天回覆切繁中電報體，砍廢話省 token —</text>
    <text x="726" y="752" text-anchor="middle" class="sub">程式碼與文件照常散文，「正常模式」關閉</text>
  </g>
</svg>
