<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1140" viewBox="0 0 980 1140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif">
  <title>Luca's Skills 主流程（含 draft 技能）</title>
  <desc>主流程加上試用中的 draft 技能：to-architecture 與 frontend-spec 在切開階段可選，implement-all 批次派工，git-commit / git-pr / git-release 收尾，refactor 與 git-merge 隨時可用。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .box  { stroke-width: 1.5; }
      .user { fill: #ddf4ff; stroke: #0969da; }
      .model{ fill: #fbefff; stroke: #8250df; }
      .draft{ stroke-dasharray: 5 3; }
      .skill{ font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 15px; fill: #1f2328; }
      .skill-sm { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1f2328; }
      .sub  { font-size: 11.5px; fill: #57606a; }
      .band-label { font-size: 12px; fill: #57606a; letter-spacing: 0.5px; }
      .band-name  { font-size: 14px; fill: #1f2328; font-weight: 600; }
      .edge { stroke: #6e7781; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 11.5px; fill: #57606a; }
      .panel-title { font-size: 13px; fill: #1f2328; font-weight: 600; }
      .note { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect width="980" height="1140" fill="#ffffff"/>

  <!-- header -->
  <text x="24" y="34" font-size="20" font-weight="700" fill="#1f2328">主流程：想法 → 出貨（含 draft 技能）</text>
  <text x="24" y="54" class="note">不確定用哪個？先打 /ask-luca。藍 = 你打字才會動，紫 = AI 也會自己用。</text>
  <rect x="800" y="22" width="14" height="14" rx="3" class="box user"/>
  <text x="822" y="34" class="note">使用者觸發</text>
  <rect x="800" y="42" width="14" height="14" rx="3" class="box model"/>
  <text x="822" y="54" class="note">模型觸發</text>
  <rect x="800" y="62" width="14" height="14" rx="3" class="box user draft"/>
  <text x="822" y="74" class="note">虛線框 = draft，試用中</text>

  <!-- stage bands -->
  <rect x="24" y="70"  width="516" height="64"  rx="10" fill="#f6f8fa"/>
  <rect x="24" y="142" width="516" height="150" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="300" width="516" height="256" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="564" width="516" height="110" rx="10" fill="#f6f8fa"/>
  <rect x="24" y="682" width="516" height="168" rx="10" fill="#f6f8fa"/>

  <!-- stage labels -->
  <text x="230" y="96"  text-anchor="end" class="band-label">階段 0</text>
  <text x="230" y="116" text-anchor="end" class="band-name">前置</text>
  <text x="230" y="176" text-anchor="end" class="band-label">階段 1</text>
  <text x="230" y="196" text-anchor="end" class="band-name">想清楚</text>
  <text x="212" y="415" text-anchor="end" class="band-label">階段 2</text>
  <text x="212" y="435" text-anchor="end" class="band-name">切開</text>
  <text x="230" y="612" text-anchor="end" class="band-label">階段 3</text>
  <text x="230" y="632" text-anchor="end" class="band-name">建置</text>
  <text x="230" y="758" text-anchor="end" class="band-label">階段 4</text>
  <text x="230" y="778" text-anchor="end" class="band-name">收尾</text>

  <!-- 0. setup-skills -->
  <rect x="250" y="80" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="100" text-anchor="middle" class="skill">/setup-skills</text>
  <text x="365" y="116" text-anchor="middle" class="sub">每個 repo 一次：追蹤器、文件、協作模式</text>
  <path d="M 365 124 L 365 156" class="edge"/>

  <!-- 1. grill-with-docs -->
  <rect x="250" y="160" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="180" text-anchor="middle" class="skill">/grill-with-docs</text>
  <text x="365" y="196" text-anchor="middle" class="sub">一問一答磨利想法，定了案才寫檔</text>

  <!-- detour out / back -->
  <path d="M 480 176 L 556 176" class="edge"/>
  <path d="M 560 225 L 440 225 L 440 232" class="edge"/>

  <!-- decision -->
  <rect x="225" y="236" width="280" height="46" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="365" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">這次要做的，一個 session 做得完嗎？</text>

  <path d="M 365 282 L 365 316" class="edge"/>
  <text x="376" y="304" class="edge-label">做不完 — 先切開</text>

  <path d="M 505 259 L 530 259 L 530 615 L 484 615" class="edge"/>
  <text x="538" y="560" class="edge-label">做得完 — 直接開工</text>

  <!-- 2. to-spec / optional drafts / to-tickets -->
  <rect x="250" y="320" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="340" text-anchor="middle" class="skill">/to-spec</text>
  <text x="365" y="356" text-anchor="middle" class="sub">把結論寫成規格，發進議題追蹤器</text>
  <path d="M 365 364 L 365 380" class="edge"/>

  <rect x="250" y="380" width="230" height="38" rx="8" class="box user draft"/>
  <text x="365" y="397" text-anchor="middle" class="skill-sm">/to-architecture</text>
  <text x="365" y="412" text-anchor="middle" class="sub">技術棧、資料模型、API 合約；出貨即刪</text>
  <text x="244" y="403" text-anchor="end" class="edge-label">可選</text>
  <path d="M 365 418 L 365 434" class="edge"/>

  <rect x="250" y="434" width="230" height="38" rx="8" class="box user draft"/>
  <text x="365" y="451" text-anchor="middle" class="skill-sm">/frontend-spec</text>
  <text x="365" y="466" text-anchor="middle" class="sub">路由、四態畫面、Pencil 稿；出貨即刪</text>
  <text x="244" y="457" text-anchor="end" class="edge-label">可選</text>
  <path d="M 365 472 L 365 488" class="edge"/>

  <rect x="250" y="488" width="230" height="44" rx="8" class="box user"/>
  <text x="365" y="508" text-anchor="middle" class="skill">/to-tickets</text>
  <text x="365" y="524" text-anchor="middle" class="sub">切成小票，每張一個 session 做得完</text>
  <path d="M 365 532 L 365 582" class="edge"/>
  <text x="376" y="562" class="edge-label">先 /clear</text>

  <!-- 3. implement + implement-all -->
  <rect x="250" y="586" width="230" height="72" rx="8" class="box user"/>
  <text x="365" y="610" text-anchor="middle" class="skill">/implement</text>
  <text x="365" y="628" text-anchor="middle" class="sub">一個 session 做一張票</text>
  <text x="365" y="644" text-anchor="middle" class="sub">會自動跑 /tdd 與 /code-review</text>
  <path d="M 365 658 L 365 686" class="edge"/>

  <rect x="560" y="586" width="270" height="72" rx="8" class="box user draft"/>
  <text x="695" y="610" text-anchor="middle" class="skill-sm">/implement-all</text>
  <text x="695" y="628" text-anchor="middle" class="sub">票多時一次派完：每票一個子代理跑 /implement</text>
  <text x="695" y="644" text-anchor="middle" class="sub">排程你點頭才派；合併還是你按</text>
  <path d="M 560 622 L 484 622" class="edge"/>

  <!-- 4. close out -->
  <rect x="250" y="690" width="230" height="40" rx="8" class="box model"/>
  <text x="365" y="707" text-anchor="middle" class="skill-sm">/code-review</text>
  <text x="365" y="722" text-anchor="middle" class="sub">/implement 收尾自動跑，通過才 commit</text>
  <path d="M 365 730 L 365 746" class="edge"/>

  <rect x="250" y="746" width="230" height="40" rx="8" class="box user draft"/>
  <text x="365" y="763" text-anchor="middle" class="skill-sm">/git-commit</text>
  <text x="365" y="778" text-anchor="middle" class="sub">只 commit 你 stage 的，英文訊息，推上遠端</text>
  <path d="M 365 786 L 365 806" class="edge"/>
  <text x="376" y="800" class="edge-label">票全部做完</text>

  <rect x="250" y="806" width="230" height="40" rx="8" class="box user draft"/>
  <text x="365" y="823" text-anchor="middle" class="skill-sm">/git-pr</text>
  <text x="365" y="838" text-anchor="middle" class="sub">開 PR；你按 merge 後再跑一次清分支</text>

  <!-- ticket loop -->
  <path d="M 250 766 L 240 766 L 240 622 L 246 622" class="edge"/>
  <text x="232" y="800" text-anchor="end" class="edge-label">還有票 → /clear，開下一張</text>

  <!-- ship + release -->
  <path d="M 480 826 L 560 826" class="edge"/>
  <text x="520" y="820" text-anchor="middle" class="edge-label">merge 是你按</text>
  <rect x="560" y="806" width="130" height="40" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="625" y="831" text-anchor="middle" class="skill-sm">PR 合併，出貨</text>
  <path d="M 690 826 L 724 826" class="edge"/>
  <text x="707" y="820" text-anchor="middle" class="edge-label">可選</text>
  <rect x="724" y="806" width="200" height="40" rx="8" class="box user draft"/>
  <text x="824" y="823" text-anchor="middle" class="skill-sm">/git-release</text>
  <text x="824" y="838" text-anchor="middle" class="sub">要發版才跑：版號、摘要、tag</text>

  <!-- detour panel -->
  <rect x="560" y="146" width="384" height="142" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="576" y="166" class="panel-title">繞道：要跑起來才能回答的問題</text>
  <text x="576" y="182" class="note">狀態模型、商業邏輯、非看不可的 UI</text>
  <text x="576" y="206" class="note">1. 跑 <tspan class="mono">/handoff</tspan>，它會印出一個文件路徑</text>
  <text x="576" y="226" class="note">2. 開新 session，第一句貼上路徑，跑 <tspan class="mono">/prototype</tspan></text>
  <text x="576" y="246" class="note">3. 答案到手，再跑 <tspan class="mono">/handoff</tspan> 拿新路徑</text>
  <text x="576" y="266" class="note">4. 再開新 session，貼上路徑，回到主流程</text>

  <!-- session rules -->
  <rect x="560" y="300" width="384" height="88" rx="10" fill="#f6f8fa"/>
  <text x="576" y="322" class="panel-title">session 規則</text>
  <text x="576" y="342" class="note">階段 1 到 2 同一個 session 一路做完，中間不 /clear。</text>
  <text x="576" y="359" class="note">/to-tickets 之後，每張票各開一個新 session。</text>
  <text x="576" y="376" class="note">session 快滿了 → /handoff，開新 session 貼路徑接著做。</text>

  <!-- on-ramps -->
  <rect x="24" y="866" width="920" height="150" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="892" class="panel-title">交流道：從外面匯進主流程</text>

  <rect x="44" y="904" width="196" height="26" rx="8" class="box user"/>
  <text x="142" y="922" text-anchor="middle" class="skill-sm">/triage</text>
  <path d="M 248 917 L 288 917" class="edge"/>
  <text x="296" y="915" class="note">匯入 /implement</text>
  <text x="296" y="930" class="note">別人回報的 bug 與需求。自己用 /to-tickets 開的票直接 /implement。</text>

  <rect x="44" y="938" width="196" height="26" rx="8" class="box model"/>
  <text x="142" y="956" text-anchor="middle" class="skill-sm">/diagnosing-bugs</text>
  <path d="M 248 951 L 288 951" class="edge"/>
  <text x="296" y="949" class="note">匯入 /improve-codebase-architecture</text>
  <text x="296" y="964" class="note">難修的 bug。修完發現病根在架構，才走這條。</text>

  <rect x="44" y="972" width="196" height="26" rx="8" class="box user"/>
  <text x="142" y="990" text-anchor="middle" class="skill-sm">/wayfinder</text>
  <path d="M 248 985 L 288 985" class="edge"/>
  <text x="296" y="983" class="note">匯入 /to-spec</text>
  <text x="296" y="998" class="note">題目大到不知從何下手。出來後接 /to-spec，不能直接跳 /implement。</text>

  <!-- development loop -->
  <path d="M 924 826 L 952 826" class="edge" style="marker-end:none" stroke-dasharray="6 4"/>
  <path d="M 944 951 L 952 951" class="edge" style="marker-end:none" stroke-dasharray="6 4"/>
  <path d="M 952 951 L 952 138 L 390 138 L 390 156" class="edge" stroke-dasharray="6 4"/>
  <text x="612" y="132" class="edge-label">回到階段 1，換下一個想法</text>
  <text x="884" y="945" text-anchor="end" class="edge-label">掃描出的改進想法</text>

  <!-- anytime layer -->
  <rect x="24" y="1032" width="920" height="84" rx="10" fill="#f6f8fa"/>
  <text x="44" y="1056" class="panel-title">隨時可用：不在流程線上，需要就叫</text>
  <text x="44" y="1080" class="skill-sm">/domain-modeling</text>
  <text x="180" y="1080" class="note">術語模糊、一詞多義；夠格的決策才立 ADR</text>
  <text x="470" y="1080" class="skill-sm">/grilling</text>
  <text x="550" y="1080" class="note">一問一答的基本功；還沒有 codebase 時用這個</text>
  <rect x="40" y="1088" width="96" height="22" rx="6" class="box model draft"/>
  <text x="88" y="1103" text-anchor="middle" class="skill-sm">/refactor</text>
  <text x="180" y="1103" class="note">不改可觀察行為的結構重整</text>
  <rect x="460" y="1088" width="106" height="22" rx="6" class="box user draft"/>
  <text x="513" y="1103" text-anchor="middle" class="skill-sm">/git-merge</text>
  <text x="580" y="1103" class="note">把分支併進來；衝突停下來，解法你決定</text>
</svg>
