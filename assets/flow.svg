<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="2280" viewBox="0 0 1320 2280" font-family="'Noto Sans TC','Microsoft JhengHei','微軟正黑體','PingFang TC',sans-serif">
  <title>Luca's Skills 藍圖：想法 → 出貨（變更驅動＋文件驅動）</title>
  <desc>主流程藍圖，雙軌：左側垂直主軸是變更驅動軌（想法→規格→票→建置→出貨），右欄「文件驅動軌」是真相層（少數合訂規格本＋docs/capabilities/ 能力薄檔，章節標能力、能力反列章節）—to-architecture 與 frontend-spec 在切開階段繞道寫入、implement 建置時落地行為、bootstrap-truth 為接管專案一次性正規化真相層（在宿主治理的形狀內瘦身文件、補能力層、安裝機械檢查）、audit-truth 持續稽核語意矛盾並把裁決寫進漂移總帳（一把立真相、一把守真相）；真相文件只在 feature branch 上改，隨 PR 與程式碼合併。feasibility 在切開階段可選，implement-all 批次派工，test-blueprint 提案測試藍圖，uat-cases 產凍結編號的驗收案例，browser-evidence 收尾留證據，refactor、git-merge 與 study-repo 隨時可用；收尾階段 git-mr（GitLab 版 git-pr）與 git-pr 並排。白卡為使用者觸發，淡靛青卡為模型觸發，虛線框為試用中的 draft。元技能見 toolbox.svg。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6B78"/>
    </marker>
    <style>
      .box   { stroke-width: 2; }
      .user  { fill: #FFFFFF; stroke: #B9C6D9; }
      .model { fill: #E3EAF3; stroke: #7E93B4; }
      .draft { stroke-dasharray: 6 4; }
      .rail  { fill: #28406B; }
      .rail-label { font-size: 16px; fill: #FFFFFF; }
      .rail-name  { font-size: 22px; fill: #FFFFFF; font-weight: 600; }
      .skill    { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 24px; fill: #1F2933; }
      .skill-sm { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; fill: #1F2933; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1F2933; }
      .sub   { font-size: 18px; fill: #5B6B78; }
      .note  { font-size: 18px; fill: #5B6B78; }
      .edge  { stroke: #5B6B78; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 18px; fill: #5B6B78; }
      .panel-title { font-size: 22px; fill: #1F2933; font-weight: 600; }
      .divider { stroke: #D9E0E6; stroke-width: 2; }
      .store-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 24px; fill: #FFFFFF; }
      .store-sub   { font-size: 18px; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1320" height="2280" fill="#FFFFFF"/>

  <!-- header -->
  <g id="header">
    <text x="48" y="88" font-size="40" font-weight="700" fill="#1F2933">主流程：想法 → 出貨</text>
    <text x="48" y="124" class="note">不確定用哪個？先打 /ask-luca。白卡 = 你打字才會動，淡靛青 = AI 也會自己用。</text>
  </g>
  <g id="legend">
    <rect x="850" y="64" width="20" height="20" rx="4" class="box user"/>
    <text x="880" y="80" class="note">白卡 = 使用者觸發</text>
    <rect x="850" y="96" width="20" height="20" rx="4" class="box model"/>
    <text x="880" y="112" class="note">淡靛青 = 模型觸發</text>
    <rect x="1090" y="64" width="20" height="20" rx="4" class="box user draft"/>
    <text x="1120" y="80" class="note">虛線框 = draft，試用中</text>
    <rect x="1090" y="96" width="20" height="20" rx="4" class="box user"/>
    <rect x="1090" y="96" width="5" height="20" fill="#E07B39"/>
    <text x="1120" y="112" class="note">橘邊 = 本圖唯一重點</text>
  </g>

  <!-- stage dividers -->
  <line x1="196" y1="272" x2="636" y2="272" class="divider"/>
  <line x1="196" y1="490" x2="636" y2="490" class="divider"/>
  <line x1="196" y1="812" x2="636" y2="812" class="divider"/>
  <line x1="196" y1="972" x2="636" y2="972" class="divider"/>

  <!-- main flow (change-driven track) -->
  <g id="main-flow">
    <!-- stage 0 -->
    <rect x="48" y="180" width="108" height="64" rx="8" class="rail"/>
    <text x="102" y="206" text-anchor="middle" class="rail-label">階段 0</text>
    <text x="102" y="232" text-anchor="middle" class="rail-name">前置</text>
    <rect x="196" y="180" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="208" text-anchor="middle" class="skill">/setup-skills</text>
    <text x="406" y="234" text-anchor="middle" class="sub">每個 repo 一次：追蹤器、文件、協作模式</text>
    <path d="M 406 244 L 406 286" class="edge"/>

    <!-- stage 1 -->
    <rect x="48" y="290" width="108" height="64" rx="8" class="rail"/>
    <text x="102" y="316" text-anchor="middle" class="rail-label">階段 1</text>
    <text x="102" y="342" text-anchor="middle" class="rail-name">想清楚</text>
    <rect x="196" y="290" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="318" text-anchor="middle" class="skill">/grill-with-docs</text>
    <text x="406" y="344" text-anchor="middle" class="sub">一問一答磨利想法，定了案才寫檔</text>

    <!-- detour out / back -->
    <path d="M 616 314 L 688 314" class="edge"/>
    <path d="M 692 358 L 520 358 L 520 396" class="edge"/>

    <path d="M 406 354 L 406 396" class="edge"/>

    <!-- decision -->
    <rect x="206" y="400" width="400" height="56" rx="10" fill="#FFFFFF" stroke="#4A648F" stroke-width="3"/>
    <text x="406" y="426" text-anchor="middle" font-size="18" font-weight="600" fill="#1F2933">動手前要先立文件嗎？</text>
    <text x="406" y="446" text-anchor="middle" font-size="13" fill="#5B6B78">多 session、動 UI、選型未定 — 任一即要</text>

    <path d="M 406 456 L 406 506" class="edge"/>
    <text x="418" y="480" class="edge-label">要 — 先切開</text>

    <path d="M 606 428 L 654 428 L 654 922 L 620 922" class="edge"/>
    <text x="612" y="420" class="edge-label">不用</text>

    <!-- stage 2 -->
    <rect x="48" y="510" width="108" height="64" rx="8" class="rail"/>
    <text x="102" y="536" text-anchor="middle" class="rail-label">階段 2</text>
    <text x="102" y="562" text-anchor="middle" class="rail-name">切開</text>
    <rect x="196" y="510" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="538" text-anchor="middle" class="skill">/to-spec</text>
    <text x="406" y="564" text-anchor="middle" class="sub">把結論寫成規格，發進議題追蹤器</text>
    <path d="M 406 574 L 406 606" class="edge"/>

    <rect x="196" y="610" width="420" height="64" rx="8" class="box user draft"/>
    <text x="406" y="638" text-anchor="middle" class="skill">/feasibility</text>
    <text x="406" y="664" text-anchor="middle" class="sub">四問一判決（✅⚠️❌），掛回 spec issue</text>
    <text x="188" y="646" text-anchor="end" class="edge-label">可選</text>
    <path d="M 406 674 L 406 706" class="edge"/>

    <!-- optional detour into the document-driven track -->
    <path d="M 616 634 L 688 634" class="edge"/>
    <text x="652" y="624" text-anchor="middle" font-size="16" fill="#5B6B78">可選繞道</text>
    <path d="M 692 742 L 620 742" class="edge"/>

    <rect x="196" y="710" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="738" text-anchor="middle" class="skill">/to-tickets</text>
    <text x="406" y="764" text-anchor="middle" class="sub">切成小票，每張一個 session 做得完</text>
    <path d="M 406 774 L 406 846" class="edge"/>
    <text x="418" y="834" class="edge-label">先 /clear</text>

    <!-- stage 3 -->
    <rect x="48" y="850" width="108" height="64" rx="8" class="rail"/>
    <text x="102" y="876" text-anchor="middle" class="rail-label">階段 3</text>
    <text x="102" y="902" text-anchor="middle" class="rail-name">建置</text>
    <rect x="196" y="850" width="420" height="92" rx="8" class="box user"/>
    <text x="406" y="882" text-anchor="middle" class="skill">/implement</text>
    <text x="406" y="908" text-anchor="middle" class="sub">一個 session 做一張票</text>
    <text x="406" y="930" text-anchor="middle" class="sub">會自動跑 /tdd 與 /code-review</text>
    <path d="M 616 884 L 768 884" class="edge"/>
    <path d="M 406 942 L 406 996" class="edge"/>

    <!-- stage 4 -->
    <rect x="48" y="1000" width="108" height="64" rx="8" class="rail"/>
    <text x="102" y="1026" text-anchor="middle" class="rail-label">階段 4</text>
    <text x="102" y="1052" text-anchor="middle" class="rail-name">收尾</text>
    <rect x="196" y="1000" width="420" height="64" rx="8" class="box model"/>
    <text x="406" y="1028" text-anchor="middle" class="skill">/code-review</text>
    <text x="406" y="1054" text-anchor="middle" class="sub">/implement 收尾自動跑，通過才 commit</text>
    <path d="M 406 1064 L 406 1096" class="edge"/>

    <rect x="196" y="1100" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="1128" text-anchor="middle" class="skill">/git-commit</text>
    <text x="406" y="1154" text-anchor="middle" class="sub">只 commit 你 stage 的，英文訊息，推上遠端</text>
    <text x="441" y="1195" text-anchor="middle" class="edge-label">票全部做完</text>

    <!-- ticket loop -->
    <path d="M 196 1132 L 180 1132 L 180 896 L 192 896" class="edge"/>
    <text x="164" y="948" text-anchor="end" class="edge-label">還有票 → /clear，</text>
    <text x="164" y="972" text-anchor="end" class="edge-label">開下一張</text>

    <rect x="196" y="1200" width="205" height="64" rx="8" class="box user"/>
    <text x="298" y="1228" text-anchor="middle" class="skill">/git-pr</text>
    <text x="298" y="1254" text-anchor="middle" class="sub">開 PR；合併後清分支</text>

    <rect x="411" y="1200" width="205" height="64" rx="8" class="box user draft"/>
    <text x="514" y="1228" text-anchor="middle" class="skill">/git-mr</text>
    <text x="514" y="1254" text-anchor="middle" class="sub">GitLab 版：開 MR</text>

    <path d="M 406 1164 L 406 1176 L 298 1176 L 298 1196" class="edge"/>
    <path d="M 406 1164 L 406 1176 L 514 1176 L 514 1196" class="edge"/>
    <path d="M 298 1264 L 298 1296" class="edge"/>
    <path d="M 514 1264 L 514 1296" class="edge"/>
    <text x="310" y="1288" class="edge-label">merge 是你按</text>

    <!-- ship: the one accent of this diagram -->
    <rect x="196" y="1300" width="420" height="64" rx="8" fill="#FFFFFF" stroke="#D9E0E6" stroke-width="2"/>
    <rect x="196" y="1300" width="8" height="64" fill="#E07B39"/>
    <text x="410" y="1340" text-anchor="middle" font-size="24" font-weight="700" fill="#E07B39">合併，出貨</text>
    <path d="M 406 1364 L 406 1396" class="edge"/>
    <text x="418" y="1388" class="edge-label">可選</text>

    <rect x="196" y="1400" width="420" height="64" rx="8" class="box user"/>
    <text x="406" y="1428" text-anchor="middle" class="skill">/git-release</text>
    <text x="406" y="1454" text-anchor="middle" class="sub">要發版才跑：版號、摘要、tag</text>

    <!-- development loop -->
    <path d="M 196 1332 L 170 1332 L 170 322 L 192 322" class="edge" stroke-dasharray="8 5"/>
    <text x="440" y="282" class="edge-label">回到階段 1，換下一個想法</text>

    <!-- code-review → browser-evidence -->
    <path d="M 616 1032 L 660 1032 L 660 1596 L 688 1596" class="edge"/>
    <text x="624" y="1024" class="edge-label">可選</text>
  </g>

  <!-- detour panel -->
  <g id="detour-panel">
    <rect x="692" y="180" width="580" height="190" rx="12" fill="#FFFFFF" stroke="#D9E0E6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="712" y="212" class="panel-title">繞道：要跑起來才能回答的問題</text>
    <text x="712" y="240" class="note">狀態模型、商業邏輯、非看不可的 UI</text>
    <text x="712" y="272" class="note">1. 跑 <tspan class="mono" font-size="18">/handoff</tspan>，它會印出一個文件路徑</text>
    <text x="712" y="300" class="note">2. 開新 session，第一句貼上路徑，跑 <tspan class="mono" font-size="18">/prototype</tspan></text>
    <text x="712" y="328" class="note">3. 答案到手，再跑 <tspan class="mono" font-size="18">/handoff</tspan> 拿新路徑</text>
    <text x="712" y="356" class="note">4. 再開新 session，貼上路徑，回到主流程</text>
  </g>

  <!-- session rules -->
  <g id="session-rules">
    <rect x="692" y="400" width="580" height="140" rx="12" fill="#FFFFFF" stroke="#D9E0E6" stroke-width="2"/>
    <text x="712" y="432" class="panel-title">session 規則</text>
    <text x="712" y="462" class="note">階段 1 到 2 同一個 session 一路做完，中間不 /clear。</text>
    <text x="712" y="490" class="note">/to-tickets 之後，每張票各開一個新 session。</text>
    <text x="712" y="518" class="note">session 快滿了 → /handoff，開新 session 貼路徑接著做。</text>
  </g>

  <!-- document-driven track -->
  <g id="doc-track">
    <rect x="692" y="580" width="580" height="600" rx="12" fill="#FFFFFF" stroke="#5B6B78" stroke-width="2"/>
    <text x="982" y="612" text-anchor="middle" class="panel-title">文件驅動軌</text>

    <rect x="772" y="630" width="420" height="64" rx="8" class="box user draft"/>
    <text x="982" y="658" text-anchor="middle" class="skill">/to-architecture</text>
    <text x="982" y="684" text-anchor="middle" class="sub">技術棧、資料模型、API 合約</text>
    <path d="M 982 694 L 982 726" class="edge"/>

    <rect x="772" y="730" width="420" height="64" rx="8" class="box user draft"/>
    <text x="982" y="758" text-anchor="middle" class="skill">/frontend-spec</text>
    <text x="982" y="784" text-anchor="middle" class="sub">路由、四態畫面、Pencil 稿</text>
    <path d="M 982 794 L 982 826" class="edge"/>

    <!-- truth layer store: second dark block of the spine -->
    <rect x="772" y="830" width="420" height="84" rx="8" class="rail"/>
    <text x="982" y="864" text-anchor="middle" class="store-title">docs/ 真相層</text>
    <text x="982" y="894" text-anchor="middle" class="store-sub">合訂規格本＋能力薄檔，互指對應</text>

    <rect x="716" y="994" width="256" height="64" rx="8" class="box user draft"/>
    <text x="844" y="1020" text-anchor="middle" class="skill-sm">/bootstrap-truth</text>
    <text x="844" y="1044" text-anchor="middle" class="sub">立真相：瘦身＋能力層</text>
    <path d="M 844 990 L 844 918" class="edge"/>

    <rect x="1008" y="994" width="256" height="64" rx="8" class="box user draft"/>
    <text x="1136" y="1020" text-anchor="middle" class="skill-sm">/audit-truth</text>
    <text x="1136" y="1044" text-anchor="middle" class="sub">守真相：掃矛盾→裁決</text>
    <path d="M 1136 990 L 1136 918" class="edge"/>

    <text x="982" y="1094" text-anchor="middle" class="note">接管老專案：一把立真相，一把守真相</text>
    <text x="982" y="1122" text-anchor="middle" class="note">真相文件只在 feature branch 上改，隨 PR 與程式碼一起合併回 main。</text>
    <text x="982" y="1150" text-anchor="middle" class="note">每個技能都讀它；讀取邊不畫。</text>
  </g>

  <!-- side cards -->
  <g id="side-cards">
    <rect x="692" y="1210" width="580" height="92" rx="8" class="box user draft"/>
    <text x="982" y="1242" text-anchor="middle" class="skill">/test-blueprint</text>
    <text x="982" y="1268" text-anchor="middle" class="sub">提案層佈局、縫清單（供 /tdd）、CI 時段</text>
    <text x="982" y="1292" text-anchor="middle" class="sub">核准才落檔；產檢查腳本、CI 與現況報告</text>
    <path d="M 982 1302 L 982 1330" class="edge"/>
    <text x="994" y="1322" class="edge-label">指派驗收層</text>

    <rect x="692" y="1334" width="580" height="64" rx="8" class="box user draft"/>
    <text x="982" y="1362" text-anchor="middle" class="skill">/uat-cases</text>
    <text x="982" y="1388" text-anchor="middle" class="sub">從 spec／user story 推導案例；TC 編號一發即凍結</text>
    <path d="M 1252 1398 L 1252 1546" class="edge"/>
    <text x="1244" y="1541" text-anchor="end" class="edge-label">清單</text>

    <rect x="692" y="1428" width="540" height="92" rx="8" class="box user draft"/>
    <text x="962" y="1460" text-anchor="middle" class="skill">/implement-all</text>
    <text x="962" y="1486" text-anchor="middle" class="sub">票多時一次派完：每票一個子代理跑 /implement</text>
    <text x="962" y="1510" text-anchor="middle" class="sub">排程你點頭才派；合併還是你按</text>

    <rect x="692" y="1550" width="580" height="92" rx="8" class="box user draft"/>
    <text x="982" y="1582" text-anchor="middle" class="skill">/browser-evidence</text>
    <text x="982" y="1608" text-anchor="middle" class="sub">驗收證據要交給別人時才跑：截圖、網路紀錄、被測版本</text>
    <text x="982" y="1632" text-anchor="middle" class="sub">清單來自 /uat-cases 或外部；判定不歸它管；證據 PR 合回基底分支</text>
  </g>

  <!-- on-ramps -->
  <g id="on-ramps">
    <rect x="48" y="1682" width="1224" height="270" rx="12" fill="#FFFFFF" stroke="#D9E0E6" stroke-width="2"/>
    <text x="72" y="1716" class="panel-title">交流道：從外面匯進主流程</text>

    <rect x="72" y="1740" width="240" height="44" rx="8" class="box user"/>
    <text x="192" y="1769" text-anchor="middle" class="skill-sm">/triage</text>
    <path d="M 312 1762 L 352 1762" class="edge"/>
    <text x="360" y="1756" class="note">匯入 /implement</text>
    <text x="360" y="1782" class="note">別人回報的 bug；自己開的票不用</text>

    <rect x="72" y="1812" width="240" height="44" rx="8" class="box model"/>
    <text x="192" y="1841" text-anchor="middle" class="skill-sm">/diagnosing-bugs</text>
    <path d="M 312 1834 L 664 1834" class="edge"/>
    <rect x="672" y="1812" width="430" height="44" rx="8" class="box user"/>
    <text x="887" y="1841" text-anchor="middle" class="skill-sm">/improve-codebase-architecture</text>
    <text x="360" y="1860" class="note">難修的 bug；病根在架構才走右邊</text>

    <rect x="72" y="1880" width="240" height="44" rx="8" class="box user"/>
    <text x="192" y="1909" text-anchor="middle" class="skill-sm">/wayfinder</text>
    <path d="M 312 1902 L 352 1902" class="edge"/>
    <text x="360" y="1896" class="note">匯入 /to-spec</text>
    <text x="360" y="1922" class="note">題目太大不知從何下手，不能跳過切開</text>
  </g>

  <!-- anytime layer -->
  <g id="anytime">
    <rect x="48" y="1992" width="1224" height="240" rx="12" fill="#FFFFFF" stroke="#D9E0E6" stroke-width="2"/>
    <text x="72" y="2026" class="panel-title">隨時可用：不在流程線上，需要就叫</text>

    <rect x="72" y="2048" width="240" height="44" rx="8" class="box model"/>
    <text x="192" y="2077" text-anchor="middle" class="skill-sm">/domain-modeling</text>
    <text x="340" y="2066" class="note">術語模糊、一詞多義；</text>
    <text x="340" y="2090" class="note">夠格的決策才立 ADR</text>
    <rect x="672" y="2048" width="240" height="44" rx="8" class="box model"/>
    <text x="792" y="2077" text-anchor="middle" class="skill-sm">/grilling</text>
    <text x="940" y="2066" class="note">一問一答的基本功；</text>
    <text x="940" y="2090" class="note">還沒有 codebase 時用這個</text>

    <rect x="72" y="2104" width="240" height="44" rx="8" class="box model draft"/>
